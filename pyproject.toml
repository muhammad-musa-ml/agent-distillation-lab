[project]
name = "agent-distillation-lab"
version = "0.1.0"
description = "A small, reproducible study of tool-policy distillation and first-error correction"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
llm = [
    "accelerate>=1,<2",
    "peft>=0.17,<1",
    "torch>=2.5,<3",
    "transformers>=4.51,<5",
]

[project.scripts]
agent-distill = "agent_distillation_lab.experiment:main"
agent-distill-llm = "agent_distillation_lab.llm_experiment:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_distillation_lab*"]
